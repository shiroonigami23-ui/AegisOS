name: Top100 Phase B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/top100_phaseb_runner.py"
      - "scripts/algorithm_selection_benchmark.py"
      - "scripts/kernel_hotpath_benchmark.py"
      - "scripts/scheduler_turbo_benchmark.py"
      - "scripts/scheduler_latency_gate.py"
      - "scripts/code_size_budget_gate.py"
      - "scripts/perf_scorecard_gate.py"
      - ".github/workflows/top100-phaseb.yml"

jobs:
  phaseb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run phase B runner
        run: python scripts/top100_phaseb_runner.py

      - name: Commit artifacts
        run: |
          if [[ -n "$(git status --porcelain docs/TOP100_PHASEB_STATUS.md benchmarks/latest/top100_phaseb_latest.json benchmarks/history/top100_phaseb_history.jsonl)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/TOP100_PHASEB_STATUS.md benchmarks/latest/top100_phaseb_latest.json benchmarks/history/top100_phaseb_history.jsonl
            git commit -m "ci: update top100 phase-b status"
            git push
          fi
